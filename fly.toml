app = 'devtools-mcp-kus'
primary_region = 'dfw'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

# Volumen persistente para tokens de Spotify OAuth
[[mounts]]
  source = 'spotify_tokens'
  destination = '/data/spotify'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
